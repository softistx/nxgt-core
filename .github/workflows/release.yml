name: Release

# Every consumer of these packages installs a published version, so a merge to
# develop that changes a package is only half a change until it is on the
# registry. This workflow is the other half: it turns the changesets sitting in
# .changeset/ into version bumps, then publishes.
#
# It opens a "Version Packages" pull request rather than publishing straight
# from develop; merging that PR is what releases. That keeps the version bump
# and the changelog reviewable, and keeps an accidental merge from publishing.

on:
  push:
    branches: [develop]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    # GitHub-hosted: this repository is public, so the minutes are free and
    # unlimited. The self-hosted runner the private repos use is a single
    # VPS that is not always online — CI here sat queued for an hour behind
    # it before this changed.
    runs-on: ubuntu-latest
    # Measured on the 60 runs up to 2026-09-27: under two minutes. Generous
    # on purpose: a publish killed half-way is worse than one waited on, and
    # the concurrency group above never cancels one under way — this only
    # stops a run that has hung.
    timeout-minutes: 10
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      published-packages: ${{ steps.changesets.outputs.published-packages }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build packages
        run: bun run build
      # No npmrc step: `bunfig.toml` reads $NPM_TOKEN from the environment.
      # v2 of the action no longer writes one from NPM_TOKEN either.
      - name: Version or publish
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: bun run changeset:version
          publish-script: bun run changeset:publish
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          # v2 ignores GITHUB_TOKEN in env for its own GitHub API calls.
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # changelog-github still reads GITHUB_TOKEN while versioning.
          # NPM_TOKEN publishes, read through bunfig.toml.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Comments on, labels `released` and closes the issues the published versions
  # fix. A job of its own so that `issues: write` reaches this step only, not
  # the job that holds the npm token. `published-packages` (hyphenated in v2 of
  # the action) is a JSON array built from the `git-tag` events
  # scripts/publish.ts writes to $CHANGESETS_OUTPUT. `continue-on-error`: the
  # packages are on npm by now, and a failure here must not turn the release
  # red; redo it by hand with `issues.ts released <package>@<version>` of the
  # nxgt-issues plugin, from a checkout (idempotent: a second run changes
  # nothing). scripts/close-released-issues*.ts is a byte-for-byte copy of the
  # plugin's canonical script (AGENTS.md, duplication table).
  close-issues:
    name: Close released issues
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # the script runs gh pr view / gh pr list
      pull-requests: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Close released issues
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ needs.release.outputs.published-packages }}
        run: bun scripts/close-released-issues.ts --published "$PUBLISHED"
