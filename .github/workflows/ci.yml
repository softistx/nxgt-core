name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  ci:
    name: CI
    # GitHub-hosted: this repository is public, so the minutes are free and
    # unlimited. The self-hosted runner the private repos use is a single
    # VPS that is not always online — CI here sat queued for an hour behind
    # it before this changed.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # `changeset status --since=origin/develop` needs the base branch.
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint code
        run: biome ci
      # Build FIRST. Every package's `exports` points at `./dist/*`, so on a
      # clean checkout `@nxgt/shared-logging` and friends resolve to nothing and
      # typecheck reports ~100 phantom TS2307s. A developer's tree always has a
      # stale `dist/` lying around, which hides this locally — it only ever
      # shows up in CI. `bun run --filter` builds in dependency order, so
      # building from nothing works.
      - name: Build packages
        run: bun run build
      - name: Type checking
        run: bun run typecheck
      # `@nxgt/shared-mongo`'s migration suite drives a real MongoDB — it asserts
      # on transactions, so a single-node **replica set** and not a plain
      # `mongod`. No auth: the URI below is passed in the environment, which
      # beats `--env-file`, so `.env.test`'s composed one never applies here.
      - name: Start MongoDB
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for _ in $(seq 30); do
            docker exec mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 })' >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval \
            'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] })'
          for _ in $(seq 30); do
            docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true && break
            sleep 1
          done
      # Per package, not one `bun test` for the whole workspace. One process for
      # everything made three test files fail for reasons that were not theirs:
      # `crypto.subtle` replaced by another file's mock, a mongoose model
      # compiled twice, and `--env-file` never applied because only the package
      # script carries it.
      - name: Run tests
        env:
          MONGODB_URI: mongodb://localhost:27017/shared-mongo-test?replicaSet=rs0
        run: bun run test
      # The build exits 0 on packages that throw the instant they are imported —
      # it happened three times. This packs them, installs them as a consumer
      # does and imports every declared subpath.
      - name: Verify the built artifacts load
        run: bun run verify:artifacts
      # A change to a package without a changeset is a change that never
      # reaches a consumer: the release workflow has nothing to version.
      #
      # Except on the release branch itself. "Version packages" is the PR that
      # *consumes* the changesets: it rewrites every version, deletes the
      # `.changeset/*.md` that justified them, and so trips this check on its
      # own output. Requiring a changeset there would mean requiring one for
      # the act of releasing.
      - name: Changeset present
        if: github.head_ref != 'changeset-release/develop'
        run: bun run changeset:status
