name: 'Setup'
description: 'Common setup steps for CI jobs'

runs:
  using: 'composite'
  steps:
    - name: Install dependencies
      # No token: @nxgt/* are public on npmjs, and installing them needs no
      # authentication. Only the release job authenticates, with NPM_TOKEN.
      run: bun i --frozen-lockfile
      shell: bash
    - name: Setup Biome
      uses: biomejs/setup-biome@v2
      with:
        version: latest
