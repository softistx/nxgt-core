name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint code
        run: biome ci
      - name: Run tests
        run: bun test
      - name: Type checking
        run: bun tsc
      - name: Build project
        run: bun run build
