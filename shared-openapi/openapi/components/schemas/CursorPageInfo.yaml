type: object
properties:
  startCursor:
    type: string
    description: The cursor of the first item in the result set.
  endCursor:
    type: string
    description: The cursor of the last item in the result set.
  hasNextPage:
    type: boolean
    description: Indicates whether there are more items after the current page.
  hasPreviousPage:
    type: boolean
    description: Indicates whether there are items before the current page.
  totalElements:
    type: integer
    description: The total number of elements across all pages.
required: [ hasNextPage, hasPreviousPage, totalElements ]
description: Cursor-based pagination information.
